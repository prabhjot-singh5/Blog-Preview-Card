<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>

  <main>

    <div class="card">


      <div class="image-container">
        <img src="assets/images/illustration-article.svg" alt="" class="image">
      </div>

      <div class="btn-container">
        <button class="btn">Learning</button>
      </div>

      <p class="published">Published 21 Dec 2023</p>

      <h1>HTML & CSS foundations</h1>

      <p class="description">These languages are the backbone of every website, defining structure, content, and presentation.</p>


      <div class="profile">
        <img src="assets/images/image-avatar.webp" alt="profile image">
        <h4>Greg Hooper</h4>
      </div>

    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Prabhjot Singh</a>.
  </footer>
</body>

</html>
